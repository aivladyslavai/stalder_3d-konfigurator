    <style>
      @property --loader-p {
        syntax: "<number>";
        inherits: true;
        initial-value: 0;
      }
      html, body { margin: 0; background: #fefefe; }
      #boot-screen {
        --loader-p: 0.08;
        position: fixed; inset: 0; z-index: 50;
        display: flex; align-items: center; justify-content: center;
        background: #fefefe;
        font-family: Mulish, "Helvetica Neue", Arial, sans-serif;
        user-select: none;
      }
      #boot-screen .scene-loader-inner {
        display: flex; width: min(320px, calc(100% - 48px));
        flex-direction: column; align-items: center; text-align: center;
      }
      #boot-screen .scene-loader-logo { height: 32px; width: auto; }
      #boot-screen .scene-loader-kicker {
        margin-top: 14px; font-size: 11px; font-weight: 700;
        letter-spacing: 0.18em; text-transform: uppercase; color: #96917e;
      }
      #boot-screen .scene-loader-pool { margin-top: 18px; height: 128px; width: 198px; overflow: visible; }
      #boot-screen .scene-loader-shadow { opacity: clamp(0, calc(var(--loader-p) / 0.18), 1); }
      #boot-screen .scene-loader-floor-g { opacity: clamp(0, calc((var(--loader-p) - 0.02) / 0.18), 1); }
      #boot-screen .scene-loader-floor { fill: #cec8bb; }
      #boot-screen .scene-loader-floor-grout { fill: none; stroke: #b7b1a4; stroke-width: 0.4; opacity: 0.7; }
      #boot-screen .scene-loader-walls {
        transform-origin: 108px 117px; transform-box: view-box;
        opacity: clamp(0, calc((var(--loader-p) - 0.04) / 0.22), 1);
        transform: scaleY(clamp(0.18, calc(0.18 + (var(--loader-p) - 0.04) / 0.32), 1));
      }
      #boot-screen .scene-loader-grout { fill: none; stroke: #c2bcb0; stroke-width: 0.5; opacity: 0.5; }
      #boot-screen .scene-loader-wall-courses { fill: none; stroke: #c9c3b7; stroke-width: 0.4; opacity: 0.45; }
      #boot-screen .scene-loader-liner { opacity: clamp(0, calc((var(--loader-p) - 0.16) / 0.2), 1); }
      #boot-screen .scene-loader-liner polygon { fill: #7f9b96; }
      #boot-screen .scene-loader-liner polygon:last-child { fill: #93ada7; }
      #boot-screen .scene-loader-coping { opacity: clamp(0, calc((var(--loader-p) - 0.2) / 0.22), 1); }
      #boot-screen .scene-loader-coping-fill { fill: #fefefe; }
      #boot-screen .scene-loader-coping-inner { fill: none; stroke: #e4e0d8; stroke-width: 1.05; }
      #boot-screen .scene-loader-led { opacity: clamp(0, calc((var(--loader-p) - 0.36) / 0.16), 1); }
      #boot-screen .scene-loader-led-glow { fill: none; stroke: #d7f3ea; stroke-width: 2.6; opacity: 0.55; }
      #boot-screen .scene-loader-led-line { fill: none; stroke: #b9ddd3; stroke-width: 0.7; }
      #boot-screen .scene-loader-trace {
        fill: none; stroke: #191923; stroke-width: 1.2;
        stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 720;
      }
      #boot-screen .scene-loader-trace-outer {
        stroke-dashoffset: calc(720 * (1 - clamp(0, calc((var(--loader-p) - 0.18) / 0.28), 1)));
      }
      #boot-screen .scene-loader-trace-inner {
        stroke-width: 0.95;
        stroke-dashoffset: calc(720 * (1 - clamp(0, calc((var(--loader-p) - 0.26) / 0.26), 1)));
      }
      #boot-screen .scene-loader-well { fill: #6d8883; opacity: clamp(0, calc((var(--loader-p) - 0.4) / 0.12), 1); }
      #boot-screen .scene-loader-step {
        opacity: clamp(0, calc((var(--loader-p) - (0.42 + var(--step, 0) * 0.04)) / 0.08), 1);
      }
      #boot-screen .scene-loader-step-top { fill: #f3f8f8; stroke: #5f726f; stroke-width: 0.4; }
      #boot-screen .scene-loader-step-front { fill: #9bb0ac; }
      #boot-screen .scene-loader-stair-lines {
        fill: none; stroke: #191923; stroke-width: 0.5; stroke-linecap: round;
        opacity: clamp(0, calc((var(--loader-p) - 0.44) / 0.24), 1);
      }
      #boot-screen .scene-loader-water { opacity: clamp(0, calc((var(--loader-p) - 0.56) / 0.28), 1); }
      #boot-screen .scene-loader-water-body { fill-opacity: 0.92; }
      #boot-screen .scene-loader-caustic { fill: #f7fffc; opacity: 0.2; }
      #boot-screen .scene-loader-water-sheen { opacity: clamp(0, calc((var(--loader-p) - 0.7) / 0.18), 1); }
      #boot-screen .scene-loader-waves {
        fill: none; stroke: #f6fcfa; stroke-width: 0.5; stroke-linecap: round;
        opacity: calc(0.62 * clamp(0, calc((var(--loader-p) - 0.76) / 0.18), 1));
        animation: none;
      }
      #boot-screen .scene-loader-waves-dup { transform: translate(-18.56px, -8px); opacity: 0.45; }
      #boot-screen .scene-loader-track {
        margin-top: 20px; height: 4px; width: 100%; overflow: hidden;
        border-radius: 99px; background: #eaeaea;
      }
      #boot-screen .scene-loader-fill-indet {
        height: 100%; width: 100%; background: #191923; border-radius: 99px;
        will-change: transform;
        transform: translate3d(-90%, 0, 0);
        animation: boot-fill 7s cubic-bezier(0.33, 0, 0.2, 1) forwards;
      }
      #boot-screen .scene-loader-copy {
        margin: 12px 0 0; display: flex; align-items: baseline; justify-content: space-between;
        width: 100%; font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
        text-transform: uppercase; color: #96917e;
      }
      #boot-screen .scene-loader-pct { color: #191923; }
      @keyframes boot-fill {
        to { transform: translate3d(-22%, 0, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-screen { --loader-p: 1; }
        #boot-screen .scene-loader-walls { transform: none; }
        #boot-screen .scene-loader-trace { stroke-dashoffset: 0; }
      }
    </style>
