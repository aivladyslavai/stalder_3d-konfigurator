<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="mask-icon" href="/brand/safari-pinned-tab.svg" color="#191923" />
    <meta name="theme-color" content="#fefefe" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pool-Konfigurator | Stalder Schwimmbadtechnik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      @property --loader-p {
        syntax: "<number>";
        inherits: true;
        initial-value: 0;
      }
      html, body { margin: 0; background: #fefefe; }
      #boot-screen {
        --loader-p: 0;
        position: fixed; inset: 0; z-index: 50;
        display: flex; align-items: center; justify-content: center;
        background: #fefefe;
        font-family: Mulish, "Helvetica Neue", Arial, sans-serif;
        user-select: none;
        animation: boot-p 4.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes boot-p { to { --loader-p: 0.82; } }
      #boot-screen .scene-loader-inner {
        display: flex; width: min(320px, calc(100% - 48px));
        flex-direction: column; align-items: center; text-align: center;
      }
      #boot-screen .scene-loader-logo { height: 32px; width: auto; }
      #boot-screen .scene-loader-kicker {
        margin-top: 14px; font-size: 11px; font-weight: 700;
        letter-spacing: 0.18em; text-transform: uppercase; color: #96917e;
      }
      #boot-screen .scene-loader-pool { margin-top: 20px; height: 118px; width: 182px; overflow: visible; }
      #boot-screen .scene-loader-floor-g { opacity: clamp(0, calc(var(--loader-p) / 0.12), 1); }
      #boot-screen .scene-loader-floor { fill: #c8c3b8; }
      #boot-screen .scene-loader-walls {
        transform-origin: 108px 117px; transform-box: view-box;
        opacity: clamp(0, calc((var(--loader-p) - 0.08) / 0.14), 1);
        transform: scaleY(clamp(0.16, calc((var(--loader-p) - 0.08) / 0.2), 1));
      }
      #boot-screen .scene-loader-wall { fill: #ddd8ce; }
      #boot-screen .scene-loader-wall-x { fill: #d2cdc3; }
      #boot-screen .scene-loader-grout { fill: none; stroke: #c4bfb4; stroke-width: 0.6; opacity: 0.7; }
      #boot-screen .scene-loader-coping-fill {
        fill: #fefefe; opacity: clamp(0, calc((var(--loader-p) - 0.24) / 0.12), 1);
      }
      #boot-screen .scene-loader-trace {
        fill: none; stroke: #191923; stroke-width: 1.35;
        stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 720;
      }
      #boot-screen .scene-loader-trace-outer {
        stroke-dashoffset: calc(720 * (1 - clamp(0, calc((var(--loader-p) - 0.26) / 0.2), 1)));
      }
      #boot-screen .scene-loader-trace-inner {
        stroke-width: 1.05;
        stroke-dashoffset: calc(720 * (1 - clamp(0, calc((var(--loader-p) - 0.34) / 0.18), 1)));
      }
      #boot-screen .scene-loader-well { fill: #c5d0cb; opacity: clamp(0, calc((var(--loader-p) - 0.46) / 0.06), 1); }
      #boot-screen .scene-loader-step {
        fill: #d7e2e6; stroke: #191923; stroke-width: 0.65; stroke-linejoin: round;
        opacity: clamp(0, calc((var(--loader-p) - (0.48 + var(--step, 0) * 0.035)) / 0.045), 1);
      }
      #boot-screen .scene-loader-stair-lines {
        fill: none; stroke: #191923; stroke-width: 0.8; stroke-linecap: round;
        opacity: clamp(0, calc((var(--loader-p) - 0.5) / 0.16), 1);
      }
      #boot-screen .scene-loader-water-body { opacity: clamp(0, calc((var(--loader-p) - 0.68) / 0.18), 1); }
      #boot-screen .scene-loader-water-sheen { opacity: clamp(0, calc((var(--loader-p) - 0.8) / 0.12), 1); }
      #boot-screen .scene-loader-waves {
        fill: none; stroke: #eef4f2; stroke-width: 0.9; stroke-linecap: round;
        opacity: calc(0.42 * clamp(0, calc((var(--loader-p) - 0.86) / 0.1), 1));
        animation: boot-waves 12s linear infinite;
      }
      #boot-screen .scene-loader-waves-dup { transform: translate(-18.56px, -8px); }
      #boot-screen .scene-loader-track {
        margin-top: 18px; height: 2px; width: 100%; overflow: hidden; background: #eaeaea;
      }
      #boot-screen .scene-loader-fill-indet {
        height: 100%; width: 100%; background: #191923;
        transform-origin: left center; will-change: transform;
        animation: boot-fill 4.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      #boot-screen .scene-loader-copy {
        margin: 12px 0 0; display: flex; align-items: baseline; justify-content: space-between;
        width: 100%; font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
        text-transform: uppercase; color: #96917e;
      }
      #boot-screen .scene-loader-pct { color: #191923; }
      @keyframes boot-waves { from { transform: translate(0, 0); } to { transform: translate(18.56px, 8px); } }
      @keyframes boot-fill {
        from { transform: scaleX(0.05); }
        to { transform: scaleX(0.72); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-screen { animation: none; --loader-p: 1; }
        #boot-screen .scene-loader-waves,
        #boot-screen .scene-loader-fill-indet { animation: none; }
        #boot-screen .scene-loader-walls { transform: none; }
        #boot-screen .scene-loader-trace { stroke-dashoffset: 0; }
      }
    </style>
  </head>
